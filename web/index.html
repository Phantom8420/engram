<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engram</title>
<meta name="description" content="Know what leaves when a maintainer does. Engram turns a project's history into one temporal FalkorDB graph.">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("engram.theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch { document.documentElement.dataset.theme = "dark"; }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #000; --text: #FFFFFF; --cap: #9A9DA4; --hover: #141518;
  --lime: #C8F560; --green: #72F28E;
  --sans: "Inter", system-ui, sans-serif;
}
[data-theme="light"] { --canvas: #FFFFFF; --text: #0B0C0F; --cap: #4F525A; --hover: #F2F3F5; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--text); font: 15px/1.55 var(--sans); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.nav { display: flex; align-items: center; gap: 8px; height: 68px; padding: 0 28px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 16px var(--sans); color: var(--text); text-decoration: none; margin-right: auto; }
.chip { width: 30px; height: 20px; border-radius: 6px; background: var(--lime); display: grid; place-items: center; }
.chip svg { width: 12px; height: 12px; }
.nav a.link { color: var(--cap); text-decoration: none; font: 500 14px var(--sans); padding: 8px 12px; border-radius: 8px; }
.nav a.link:hover { color: var(--text); background: var(--hover); }
.theme { border: 0; background: var(--hover); color: var(--text); width: 34px; height: 34px; border-radius: 9px; cursor: pointer; display: grid; place-items: center; margin-left: 6px; }
.theme svg { width: 16px; height: 16px; }
[data-theme="light"] .sun, :root:not([data-theme="light"]) .moon { display: none; }

/* one centred block on a plain page */
.hero { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; padding: 0 20px 68px; }
.mark { width: 56px; height: 38px; border-radius: 11px; background: var(--lime); display: grid; place-items: center; }
.mark svg { width: 20px; height: 20px; }
.hero h1 { font: 700 44px/1.1 var(--sans); letter-spacing: -.03em; margin: 22px 0 14px; }
.hero p { margin: 0; color: var(--cap); font-size: 17px; max-width: 44ch; }
.open { display: inline-flex; margin-top: 32px; background: var(--lime); color: #070A10; text-decoration: none; font: 600 15px var(--sans); padding: 13px 22px; border-radius: 12px; }
.open:hover { background: #D6FA7E; }
@media (max-width: 760px) {
  .nav { padding: 0 16px; height: 60px; }
  .nav a.link { padding: 8px; font-size: 13px; }
  .hero h1 { font-size: 34px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="spark" viewBox="0 0 16 16"><path d="M8 0c.5 4.2 3.8 7.5 8 8-4.2.5-7.5 3.8-8 8-.5-4.2-3.8-7.5-8-8 4.2-.5 7.5-3.8 8-8z" fill="#070A10"/></symbol>
</svg>

<nav class="nav" aria-label="Main">
  <a class="brand" href="/"><span class="chip"><svg><use href="#spark"/></svg></span>Engram</a>
  <a class="link" href="/about">How it works</a>
  <a class="link" href="/app">Dashboard</a>
  <button class="theme" id="theme" aria-label="Switch light or dark mode"><svg class="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 0v2.2M8 13.8V16M0 8h2.2M13.8 8H16M2.3 2.3l1.6 1.6M12.1 12.1l1.6 1.6M2.3 13.7l1.6-1.6M12.1 3.9l1.6-1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><svg class="moon" viewBox="0 0 16 16"><path d="M13.5 10.4A6 6 0 0 1 5.6 2.5 6 6 0 1 0 13.5 10.4z" fill="currentColor"/></svg></button>
</nav>

<main class="hero">
  <span class="mark" aria-hidden="true"><svg><use href="#spark"/></svg></span>
  <h1>Engram</h1>
  <p>Know what leaves when a maintainer does. One FalkorDB graph of who really knows the code.</p>
  <a class="open" href="/app">Open dashboard</a>
</main>

<script>
document.getElementById("theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("engram.theme", t); } catch {}
};
</script>
</body>
</html>
