services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # graph
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  api:
    build: .
    depends_on: [falkordb]
    environment:
      FALKORDB_HOST: falkordb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  falkordb-data:
